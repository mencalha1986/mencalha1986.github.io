<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autorama da Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#9fd3ff;
  --panel:rgba(255,255,255,.9);
  --panel-2:rgba(30,30,70,.07);
  --line:rgba(30,30,70,.16);
  --text:#16132e;
  --muted:#5b5880;
  --good:#0b9e60;
  --bad:#d91e48;
  --red:#e63946;
  --overlay:rgba(10,14,40,.5);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:rgba(14,14,34,.8);
    --panel-2:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.14);
    --text:#ffffff;
    --muted:#b9b6dd;
    --good:#2ee59d;
    --bad:#ff5a7d;
    --overlay:rgba(4,6,20,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:rgba(14,14,34,.8);
  --panel-2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.14);
  --text:#ffffff;
  --muted:#b9b6dd;
  --good:#2ee59d;
  --bad:#ff5a7d;
  --overlay:rgba(4,6,20,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.disp{font-family:"Lilita One",Nunito,sans-serif;font-weight:400}

/* placar */
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:300px;right:300px;max-width:470px;margin:0 auto;padding:10px 12px 10px;z-index:5;pointer-events:none}
#top .hd{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 6px}
#top h1{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:21px;margin:0;line-height:1}
#top h1 span{color:var(--red)}
#score{font-weight:900;font-size:13.5px;white-space:nowrap}
#lapInfo{font-family:"Lilita One",Nunito,sans-serif;font-size:15px;text-align:center;margin-bottom:6px;color:var(--muted)}
#lapInfo b{color:var(--text);font-weight:400}
#stand{display:grid;gap:3px}
.sr{display:grid;grid-template-columns:30px 14px 1fr auto;align-items:center;gap:7px;padding:4px 8px;border-radius:10px;background:var(--panel-2);font-weight:900;font-size:14px;transition:background .2s}
.sr.us{background:rgba(230,57,70,.18);outline:2px solid rgba(230,57,70,.55)}
.sr .ps{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:17px}
.sr .dt{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.sr .lp{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;justify-content:center}
.chip{font-size:12.5px;font-weight:900;padding:3px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.chip.g{color:var(--good)} .chip.b{color:var(--bad)}
.chip[hidden]{display:none}

/* legendas laterais */
.legend{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:8px;z-index:6}
#legBad{left:10px;align-items:flex-start}
#legGood{right:10px;align-items:flex-end}
.leg{position:relative;display:flex;align-items:center;gap:6px;background:none;border:0;padding:3px 6px;border-radius:14px;transition:transform .1s}
.leg:hover{transform:scale(1.06)}
.leg:active{transform:scale(.93)}
.li{font-size:52px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.li.gg{font-family:"Lilita One",Nunito,sans-serif;font-size:46px;background:linear-gradient(180deg,#ff5ea8,#ffd23f 45%,#22e0c8 70%,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #3a1050;padding:0 2px}
.ln{font-family:"Lilita One",Nunito,sans-serif;font-size:25px;line-height:.95;color:#ffe14d;-webkit-text-stroke:5px #2a1a00;paint-order:stroke fill;text-align:left}
#legGood .ln{text-align:right}
.leg kbd{position:absolute;bottom:-4px;font-family:inherit;font-size:10.5px;font-weight:900;color:#fff;background:rgba(0,0,0,.55);border-radius:5px;padding:0 5px}
#legBad .leg kbd{left:4px}
#legGood .leg kbd{right:4px}

/* interações */
#inter{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);padding:8px 10px;z-index:5;display:grid;gap:4px;width:250px}
.ir{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;background:none;border:0;padding:4px 6px;border-radius:10px;text-align:left}
.ir:hover{background:var(--panel-2)}
.ir .ie{font-size:24px}
.ir b{display:block;font-size:13.5px;font-weight:900}
.ir small{display:block;font-size:12px;color:var(--muted);font-weight:800}

/* feed */
#feed{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:260px;display:flex;flex-direction:column-reverse;gap:5px;z-index:4;pointer-events:none}
.fi{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 9px;border-radius:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--good);animation:fin .35s ease-out;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fi.bad{border-left-color:var(--bad)}
.fi.neu{border-left-color:#38bdf8}
.fi .fe{font-size:20px;line-height:1;min-width:24px;text-align:center;font-weight:900}
.fi b{font-weight:900}
.fi small{display:block;color:var(--muted);font-weight:800;font-size:11.5px}
.fi:nth-child(n+5){display:none}
@keyframes fin{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}

/* banner */
#banner{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);text-align:center;pointer-events:none;opacity:0;z-index:7;width:min(94vw,760px)}
#banner.show{animation:pop 2.2s ease-out forwards}
#banner .bt{font-family:"Lilita One",Nunito,sans-serif;font-size:clamp(38px,8vw,76px);line-height:1;color:#fff;-webkit-text-stroke:3px rgba(0,0,0,.6);paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.35)}
#banner.good .bt{color:#3ff5a6} #banner.bad .bt{color:#ff5a7d} #banner.gold .bt{color:#ffd23f} #banner.blue .bt{color:#5fd4ff}
#banner .bs{margin-top:6px;font-weight:900;font-size:clamp(15px,2.6vw,20px);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.95)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}

/* luzes de largada */
#lights{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);display:none;gap:10px;padding:12px 16px;background:#111;border-radius:16px;border:3px solid #333;z-index:7;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#lights.on{display:flex}
#lights i{width:clamp(30px,7vw,44px);height:clamp(30px,7vw,44px);border-radius:50%;background:#3a0b0b;box-shadow:inset 0 -4px 0 rgba(0,0,0,.4)}
#lights i.r{background:radial-gradient(circle at 35% 30%,#ff9a9a,#ff1f1f 55%,#a30000);box-shadow:0 0 18px #ff2a2a}
#lights i.g{background:radial-gradient(circle at 35% 30%,#b6ffcf,#18e05d 55%,#078a34);box-shadow:0 0 18px #20ff70}

/* cantos */
#corner{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:6px;z-index:6}
.cbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-weight:900;font-size:13px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);white-space:nowrap}
.cbtn.on{border-color:var(--good);color:var(--good)}

/* overlay */
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:var(--overlay);z-index:10;padding:16px}
#overlay[hidden]{display:none}
.card{width:min(470px,100%);padding:24px 22px 20px;text-align:center;max-height:100%;overflow:auto}
.card .logo{font-size:50px;line-height:1;margin-bottom:6px}
.card h2{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:38px;margin:0 0 8px;line-height:1}
.card p{margin:0 0 12px;color:var(--muted);font-weight:800;line-height:1.45;font-size:15px}
.card p b{color:var(--text)}
.lbl{font-weight:900;font-size:13.5px;margin-bottom:4px}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:2px 0 12px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:900;font-size:14px}
.seg button.sel{background:var(--red);color:#fff}
.check{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--red)}
.big{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:var(--red);color:#fff;font-family:"Lilita One",Nunito,sans-serif;font-size:22px;box-shadow:0 5px 0 #a3202c}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #a3202c}
.hint{font-size:12.5px!important;margin:14px 0 0!important}
.hint kbd{font-family:inherit;font-weight:900;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--text)}
.podium{display:grid;gap:5px;margin:4px 0 14px;text-align:left}
.podium .sr{font-size:15px}

@media (max-width:980px){
  #top{left:8px;right:8px;max-width:none;padding:8px 10px}
  #top h1{font-size:17px}
  #lapInfo{font-size:13px;margin-bottom:4px}
  .sr{font-size:12.5px;padding:2px 7px;grid-template-columns:24px 12px 1fr auto}
  .sr .ps{font-size:14px}
  .sr .dt{width:12px;height:12px}
  .legend{top:calc(env(safe-area-inset-top,0px) + 200px);gap:2px}
  #legBad{left:2px} #legGood{right:2px}
  .li{font-size:34px} .li.gg{font-size:28px}
  .ln{font-size:16px;-webkit-text-stroke:4px #2a1a00}
  .leg kbd{display:none}
  #inter{width:auto;right:auto;padding:5px 6px;bottom:calc(env(safe-area-inset-bottom,0px) + 58px)}
  .ir{padding:2px 4px}
  .ir .ie{font-size:19px}
  .ir b{font-size:12px}
  .ir small{display:none}
  #feed{width:46vw;right:6px}
  .fi{font-size:11.5px;padding:4px 7px}
  .fi small{display:none}
  .fi:nth-child(n+4){display:none}
  #corner .cbtn span{display:none}
}
@media (prefers-reduced-motion:reduce){.fi{animation:none}}

/* ícones oficiais dos presentes */
img.li{width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
span.li.emo{font-size:50px}
.fi img.fe{width:24px;height:24px;object-fit:contain;flex-shrink:0;min-width:0}
#banner .bi{width:clamp(48px,9vw,86px);height:clamp(48px,9vw,86px);object-fit:contain;vertical-align:middle;margin-right:8px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
#banner span.bi.emo{font-size:clamp(40px,8vw,70px);width:auto;height:auto}
@media (max-width:980px){ img.li{width:40px;height:40px} span.li.emo{font-size:34px} }
#tapSound{position:fixed;left:50%;bottom:300px;transform:translateX(-50%);background:#ffd23f;color:#1d1636;font-weight:900;font-size:17px;padding:9px 16px;border-radius:999px;z-index:30;cursor:pointer;display:none;white-space:nowrap}
#tapSound.show{display:block}

/* ===== JANELA DA LIVE (?obs=1): palco fixo 9:16 (540×960), igual em qualquer tamanho de janela ===== */
.live #top{left:8px;right:8px;max-width:none;padding:8px 10px}
.live #top h1{font-size:17px}
.live #lapInfo{font-size:13px;margin-bottom:4px}
.live .sr{font-size:12.5px;padding:2px 7px;grid-template-columns:24px 12px 1fr auto}
.live .sr .ps{font-size:14px}
.live .sr .dt{width:12px;height:12px}
.live .legend{top:calc(env(safe-area-inset-top,0px) + 200px);gap:2px}
.live #legBad{left:2px}
.live #legGood{right:2px}
.live .li{font-size:34px}
.live .li.gg{font-size:28px}
.live .ln{font-size:16px;-webkit-text-stroke:4px #2a1a00}
.live .leg kbd{display:none}
.live #inter{width:auto;right:auto;padding:5px 6px;bottom:calc(env(safe-area-inset-bottom,0px) + 58px)}
.live .ir{padding:2px 4px}
.live .ir .ie{font-size:19px}
.live .ir b{font-size:12px}
.live .ir small{display:none}
.live #feed{width:46vw;right:6px}
.live .fi{font-size:11.5px;padding:4px 7px}
.live .fi small{display:none}
.live .fi:nth-child(n+4){display:none}
.live #corner .cbtn span{display:none}
.live img.li{width:40px;height:40px} .live span.li.emo{font-size:34px}
.live body{background:#000}
.live #stage{position:fixed;left:50%;top:50%;width:540px;height:960px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:var(--bg)}
/* áreas livres do TikTok: topo (nome/perfil) e rodapé (botões) */
.live #top{top:126px}
.live .legend{top:322px}
.live #inter{bottom:128px}
.live #feed{bottom:128px}
.live #lights{bottom:200px}
.live #corner,.live .leg kbd,.live #menuBtn{display:none!important}
.live .card .big{pointer-events:none}
/* tamanhos fixos no palco (vw seguiria a janela, não o palco) */
.live #feed{width:250px}
.live #banner{width:500px}
.live #banner .bt{font-size:54px}
.live #banner .bs{font-size:17px}
.live #banner .bi{width:64px;height:64px}
.live #banner span.bi.emo{font-size:52px}
.live #lights i{width:40px;height:40px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="panel">
  <div class="hd"><h1>Autorama da <span>Live</span></h1><div id="score">🏆 0 · 💀 0</div></div>
  <div id="lapInfo">Prepare-se</div>
  <div id="stand"></div>
  <div class="chips">
    <span id="chNitro" class="chip g" hidden></span>
    <span id="chRev" class="chip b" hidden></span>
    <span id="chCrash" class="chip b" hidden></span>
    <span id="chRival" class="chip b" hidden></span>
  </div>
</div>

<div id="legBad" class="legend" aria-label="Presentes que atrapalham o nosso carro"></div>
<div id="legGood" class="legend" aria-label="Presentes que ajudam o nosso carro"></div>

<div id="inter" class="panel" aria-label="Interações"></div>
<div id="feed"></div>

<div id="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div id="tapSound">🔊 Clique aqui para ligar o som</div>
<div id="banner"><div class="bt"></div><div class="bs"></div></div>

<div id="corner">
  <button class="cbtn" id="btnSound" aria-label="Som">🔊 <span>Som</span></button>
  <button class="cbtn" id="btnSim" aria-label="Live simulada">🤖 <span>Live simulada</span></button>
  <button class="cbtn" id="btnCam" aria-label="Câmera">🎥 <span>Câmera: auto</span></button>
  <button class="cbtn" id="btnPick" aria-label="Escolher presentes">🎁 <span>Escolher presentes</span></button>
  <button class="cbtn" id="btnLive" aria-label="Abrir janela da live">📺 <span>Abrir janela da live</span></button>
</div>

<div id="overlay"><div class="card panel" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../jogos-live/escolher-presentes.js?v=1"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= presentes e interações ================= */

function updateBursts(dt){
  for(let b=bursts.length-1;b>=0;b--){
    const B=bursts[b]; B.t+=dt;
    const pa=B.pts.geometry.attributes.position.array;
    for(let i=0;i<B.count;i++){B.vel[i*3+1]-=B.grav*dt;pa[i*3]+=B.vel[i*3]*dt;pa[i*3+1]+=B.vel[i*3+1]*dt;pa[i*3+2]+=B.vel[i*3+2]*dt;}
    B.pts.geometry.attributes.position.needsUpdate=true;
    B.pts.material.opacity=Math.max(0,1-B.t/B.life);
    if(B.t>=B.life){scene.remove(B.pts);B.pts.geometry.dispose();B.pts.material.dispose();bursts.splice(b,1);}
  }
}

/* ================= áudio ================= */
let ac=null,muted=false,eng=null,engGain=null,engFilt=null,noiseBuf=null,crowdBuf=null;
function audio(){
  if(!ac){
    try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}
    if(ac){
      eng=ac.createOscillator(); eng.type="sawtooth"; eng.frequency.value=90;
      engFilt=ac.createBiquadFilter(); engFilt.type="lowpass"; engFilt.frequency.value=900;
      engGain=ac.createGain(); engGain.gain.value=0;
      eng.connect(engFilt); engFilt.connect(engGain); engGain.connect(ac.destination); eng.start();
      noiseBuf=ac.createBuffer(1,ac.sampleRate*.8,ac.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      crowdBuf=ac.createBuffer(1,ac.sampleRate*2.5,ac.sampleRate);
      const d2=crowdBuf.getChannelData(0); for(let i=0;i<d2.length;i++) d2[i]=Math.random()*2-1;
    }
  }
  if(ac&&ac.state==="suspended") ac.resume();
}
function tone(f,d,type,v,when,f2){
  if(!ac||muted) return;
  const t0=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(v||.08,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+d+.03);
}
function noise(v,d){
  if(!ac||muted||!noiseBuf) return;
  const s=ac.createBufferSource(),g=ac.createGain(); s.buffer=noiseBuf;
  g.gain.setValueAtTime(v,ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  s.connect(g); g.connect(ac.destination); s.start();
}
const sfx={
  beep:()=>tone(520,.18,"square",.07),
  go:()=>tone(1040,.45,"square",.08),
  good:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.15,"triangle",.07,i*.06)),
  bad:()=>{tone(330,.4,"sawtooth",.06,0,90);},
  whoosh:()=>{tone(200,.6,"sine",.12,0,1700);tone(900,.4,"triangle",.05,.2,2400);},
  nitro:()=>{tone(160,.5,"sawtooth",.05,0,700);noise(.08,.4);},
  crash:()=>{noise(.35,.7);tone(140,.6,"square",.08,0,40);},
  honk:()=>{tone(392,.14,"square",.06);tone(392,.2,"square",.06,.18);},
  lap:()=>tone(880,.12,"triangle",.05),
  win:()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.22,"triangle",.08,i*.12)),
  lose:()=>{tone(392,.3,"triangle",.08);tone(330,.3,"triangle",.08,.3);tone(262,.8,"triangle",.08,.6);},
  cheer:(v)=>{
    if(!ac||muted||!crowdBuf) return;
    const now=ac.currentTime;
    [[700,.9],[1700,.6]].forEach(([fq,q])=>{
      const s=ac.createBufferSource(); s.buffer=crowdBuf; s.loop=true;
      const f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=fq; f.Q.value=q;
      const g=ac.createGain();
      g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.2*v,now+.3); g.gain.exponentialRampToValueAtTime(.0001,now+2.3);
      s.connect(f); f.connect(g); g.connect(ac.destination); s.start(now); s.stop(now+2.4);
    });
    const voices=Math.round(3+5*v);
    for(let i=0;i<voices;i++){const st=.05+Math.random()*.7,f0=230+Math.random()*300;tone(f0,.45+Math.random()*.3,"sawtooth",.012*v,st,f0*(1.25+Math.random()*.3));}
    if(v>.8){tone(2500,.22,"sine",.045,.15,3300);tone(3100,.35,"sine",.04,.45,1900);}
  }
};
function engineUpdate(){
  if(!ac||!engGain) return;
  const racing=(state==="race"||state==="finish")&&!us.crash&&!muted;
  const sp=Math.abs(us.m);
  const target=racing?.025+.015*Math.min(sp,2):0;
  engGain.gain.setTargetAtTime(target,ac.currentTime,.1);
  eng.frequency.setTargetAtTime(70+sp*95+(us.nitroT>0?60:0),ac.currentTime,.08);
  engFilt.frequency.setTargetAtTime(500+sp*700,ac.currentTime,.1);
}

/* ================= efeitos ================= */
function carPos(c){return c.g.position.clone().setY(.5);}
function startTele(car,newP,color){
  car.tele={t:0,swapped:false,newP:Math.max(0,newP),color};
  burst(carPos(car),color,70,6,1,.32);
}
function startCrash(car,dur){
  if(car.crash){car.crash.dur=Math.max(car.crash.dur,car.crash.t+dur);return;}
  car.tele=null; car.g.scale.setScalar(1); car.nitroT=0; car.revT=0;
  const f=car.fwd||{x:0,z:1};
  const side=Math.random()<.5?-1:1;
  const sp=10+Math.abs(car.m)*6;
  car.crash={t:0,dur,pos:car.g.position.clone(),vel:new THREE.Vector3(f.x*sp*.5+(-f.z)*side*7,7.5,f.z*sp*.5+f.x*side*7),spin:new THREE.Vector3((Math.random()-.5)*14,(Math.random()-.5)*16,(Math.random()-.5)*10),landed:false,smokeT:0,camF:{x:f.x,z:f.z}};
  burst(carPos(car),[0xffd23f,0xff7a00,0xff2a2a],80,9,.9,.35);
  sfx.crash();
}
function trigger(ev,user){
  if(state==="countdown"){pending.push([ev,user]);addFeed(ev,user+" (na largada)",ev.type==="good"?"good":"bad");return;}
  if(state!=="race") return;
  apply(ev,user);
}
function apply(ev,user){
  const cls=ev.id==="follow"?"neu":ev.type;
  addFeed(ev,user,cls);
  switch(ev.kind){
    case "nitro":
      if(!us.crash) us.nitroT=Math.min(12,us.nitroT+ev.s);
      if(ev.id==="like"){burst(carPos(us),0xff4d8d,14,3,.6,.28);}
      else{showBanner("NITRO!",user+" mandou "+ev.name,"good",ev);sfx.nitro();forceChaseT=4;}
      break;
    case "jump":{
      const good=ev.n>0;
      if(us.crash){us.p=Math.max(0,us.p+ev.n);}
      else startTele(us,us.p+ev.n,good?0x3ff5a6:0xff5a7d);
      showBanner((good?"+":"−")+fracTxt(Math.abs(ev.n)),user+" mandou "+ev.name,good?"good":"bad",ev);
      good?sfx.whoosh():sfx.bad(); forceChaseT=4; if(good) excite=1;
      break;
    }
    case "rivalNitro":
      rivalNitroT=Math.min(15,rivalNitroT+ev.s);
      showBanner("RIVAIS NO NITRO!",user+" mandou "+ev.name,"bad",ev); sfx.nitro();
      break;
    case "rivalJump":
      rivals.forEach(r=>{if(!r.finished) startTele(r,r.p+ev.n,0xff5a7d);});
      showBanner("RIVAIS +1 VOLTA!",user+" mandou "+ev.name,"bad",ev); sfx.bad();
      break;
    case "crash":
      startCrash(us,ev.s);
      showBanner("QUEBROU!",user+" mandou "+ev.name,"bad",ev); forceChaseT=5;
      break;
    case "reverse":
      if(!us.crash){us.revT=Math.min(10,us.revT+ev.s);}
      showBanner("👤 NOVO SEGUIDOR!",user+" seguiu · nosso carro deu ré","blue"); sfx.honk(); forceChaseT=3;
      break;
  }
}
function fracTxt(n){return n===.25?"¼ VOLTA":n===.5?"½ VOLTA":n===1?"1 VOLTA":n+" VOLTA";}
function randomEvent(){
  const r=Math.random();
  if(r<.16){trigger(EXTRA[0],NAMES[Math.floor(Math.random()*NAMES.length)]);return;}
  const tot=GIFTS.reduce((a,g)=>a+g.w,0);let x=Math.random()*tot,i=0;
  while(x>GIFTS[i].w&&i<GIFTS.length-1){x-=GIFTS[i].w;i++;}
  trigger(GIFTS[i],NAMES[Math.floor(Math.random()*NAMES.length)]);
}

function resetCars(){
  cars.forEach(c=>{
    c.p=0;c.m=0;c.nitroT=0;c.revT=0;c.crash=null;c.tele=null;c.finished=false;c.lastLap=0;c.nearStand=true;
    c.base=c.isUs?1:(0.97+Math.random()*.06); c.ph=Math.random()*6.28;
    c.g.scale.setScalar(1); c.body.rotation.set(0,0,0); place(c);
  });
  rivalNitroT=0;
}
function startRace(){

  $("#feed").innerHTML="";
  $("#overlay").hidden=true;

function endRace(){
  state="finish"; finT=0;
  const st=standings();
  winner=st[0];
  if(winner.isUs){wins++;showBanner("🏆 VITÓRIA!","Nosso carro venceu a corrida!","gold");sfx.win();cheer(null,true);
    for(let k=0;k<4;k++) setTimeout(()=>burst(carPos(us).setY(1.5),null,160,11,2.2,.35,6,2),k*350);
  } else {losses++;showBanner("😭 PERDEMOS!",winner.emoji+" "+winner.name+" venceu","bad");sfx.lose();burst(carPos(winner).setY(1.5),null,120,9,1.8,.3,6,2);}
  us.nitroT=0; us.revT=0; rivalNitroT=0;
  if(us.crash) us.crash.dur=Math.min(us.crash.dur,us.crash.t+.6);
}
function updateCar(car,dt,mode){
  if(car.tele){
    car.tele.t+=dt; const t=car.tele.t;
    let s;
    if(t<.35){s=1-t/.35;}
    else{
      if(!car.tele.swapped){car.tele.swapped=true;car.p=car.tele.newP;place(car);burst(carPos(car),car.tele.color,70,6,1,.32);}
      s=Math.min(1,(t-.35)/.35);
    }
    car.g.scale.setScalar(Math.max(.01,s)); car.g.rotation.y+=dt*20*(1-s);
    if(t>=.7){car.tele=null;car.g.scale.setScalar(1);place(car);}
    return;
  }
  if(car.crash){
    const C=car.crash; C.t+=dt;
    C.vel.y-=22*dt; C.pos.addScaledVector(C.vel,dt);
    if(C.pos.y<=0){C.pos.y=0; if(Math.abs(C.vel.y)>1.5){C.vel.y*=-.35;burst(C.pos.clone().setY(.3),0x9a8b70,20,3,.8,.3);} else C.vel.y=0; C.vel.x*=.55; C.vel.z*=.55; C.spin.multiplyScalar(.6); C.landed=true;}
    car.g.position.copy(C.pos);
    car.body.rotation.x+=C.spin.x*dt; car.body.rotation.z+=C.spin.z*dt; car.g.rotation.y+=C.spin.y*dt;
    C.smokeT-=dt;
    if(C.smokeT<=0){C.smokeT=.09;burst(C.pos.clone().setY(C.pos.y+.4),[0x555555,0x777777,0x333333],5,1.2,1.4,.6,-1.5,1);if(Math.random()<.3)burst(C.pos.clone().setY(C.pos.y+.3),0xff7a00,4,1.5,.5,.3,-2);}
    car.m=0;
    if(C.t>=C.dur){
      car.crash=null; car.body.rotation.set(0,0,0); place(car);
      car.tele={t:.35,swapped:true,newP:car.p,color:0xffd23f};
      burst(carPos(car),[0xffd23f,0xffffff],90,6,1.1,.32); sfx.whoosh();
      if(car.isUs) showBanner("🔧 CONSERTADO!","De volta à pista","blue");
    }
    return;
  }
  let m;
  if(mode==="idle") m=0;
  else if(mode==="cool") m=car.base*.55;
  else if(car.isUs){
    m=car.base*(1+.02*Math.sin(T*.7+car.ph));
    if(car.revT>0) m=-.5; else if(car.nitroT>0) m*=1.85;
  } else {
    m=car.base*(1+.045*Math.sin(T*.45+car.ph));
    if(rivalNitroT>0) m*=1.6;
  }
  car.m=m;
  car.p=Math.max(0,car.p+m*dt/lapTime);
  place(car);
  if(car.isUs&&car.revT>0) car.body.rotation.z=Math.sin(T*25)*.04; else car.body.rotation.z=0;
  car.wheelA+=m*dt/lapTime*LEN/.18;
  car.wheels.forEach(w=>w.rotation.x=car.wheelA);
  const nitro=(car.isUs&&car.nitroT>0&&mode==="race")||(!car.isUs&&rivalNitroT>0&&mode==="race");
  if(nitro&&Math.random()<dt*45){
    const f=car.fwd;
    burst(new THREE.Vector3(car.g.position.x-f.x*.95,.3,car.g.position.z-f.z*.95),car.isUs?[0xff7a00,0xffd23f,0xff3a00]:[0x5fd4ff,0x9b5cff],5,1.6,.35,.28,-2,.4);
  }
}

/* ================= câmera ================= */
const camDesired=new THREE.Vector3(),camLookT=new THREE.Vector3();
const tvPts=[];
for(let k=0;k<10;k++){const s=S[Math.floor(k*M/10)],o=s.n.clone();if(o.dot(s.p.clone().sub(center))<0)o.negate();let q=s.p.clone().addScaledVector(o,11).setY(4.5);if(q.distanceTo(standPos)<18)q=s.p.clone().addScaledVector(o,-9).setY(4.5);tvPts.push(q);}
const spanX=maxX-minX,spanZ=maxZ-minZ;
function camUpdate(dt){
  let mode;
  if(state==="menu") mode="orbit";
  else if(state==="countdown") mode="grid";
  else if(state==="finish") mode=finT<3?"winner":"aerial";
  else if(camMode==="auto"){ mode=forceChaseT>0?"chase":["chase","tv","aerial","chase"][Math.floor(autoCycleT/8)%4]; }
  else mode=camMode;
  const up=us.g.position;
  if(mode==="orbit"){
    const R=portrait?62:58,a=T*.08;
    camDesired.set(center.x+Math.cos(a)*R,portrait?46:30,center.z+Math.sin(a)*R); camLookT.copy(center);
  } else if(mode==="grid"){
    camDesired.copy(s0.p).addScaledVector(s0.t,portrait?9:7.5).setY(portrait?3.4:2.6);
    camLookT.copy(s0.p).addScaledVector(s0.t,-1.5).setY(.4);
  } else if(mode==="chase"||mode==="winner"){
    const tgt=mode==="winner"&&winner?winner:us;
    const f=tgt.crash?tgt.crash.camF:(tgt.fwd||{x:0,z:1});
    const pos=tgt.crash?tgt.crash.pos:tgt.g.position;
    const back=portrait?8.5:6.8,h=portrait?4.6:3.3;
    if(mode==="winner"){
      const a=T*.6;
      camDesired.set(pos.x+Math.cos(a)*7,3.5,pos.z+Math.sin(a)*7); camLookT.set(pos.x,.6,pos.z);
    } else {
      camDesired.set(pos.x-f.x*back,h,pos.z-f.z*back); camLookT.set(pos.x+f.x*4,.4,pos.z+f.z*4);
    }
  } else if(mode==="tv"){
    let best=tvPts[0],bd=1e9; tvPts.forEach(p=>{const d=p.distanceToSquared(up);if(d<bd){bd=d;best=p;}});
    camDesired.copy(best); camLookT.set(up.x,.5,up.z);
  } else {
    if(portrait){
      camDesired.set(center.x+spanX*.08,spanX*.95,center.z+spanZ*.9);
    } else {
      camDesired.set(center.x,spanX*.7,center.z+spanZ*1.25);
    }
    camLookT.copy(center);
  }
  const k=camSnap?1:1-Math.exp(-dt*(mode===lastMode?5:2));
  camera.position.lerp(camDesired,k); camLook.lerp(camLookT,k); camera.lookAt(camLook);
  lastMode=mode; camSnap=false;
}

    '<button class="cbtn" id="pickBtn2" style="width:100%;margin-bottom:12px;padding:12px;font-size:15px">🎁 Escolher os presentes da live</button>'+
    '<button class="big" id="startBtn">Começar corrida</button>'+
    '<p class="hint">Tudo roda sozinho; ao fim de cada corrida a próxima começa.<br>Ajudam: <kbd>1</kbd>–<kbd>4</kbd> · Atrapalham: <kbd>Z</kbd> <kbd>X</kbd> <kbd>C</kbd> <kbd>V</kbd> · Seguidor: <kbd>F</kbd></p>';
  $("#overlay").hidden=false;
  const seg=(id,fn)=>$(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;fn(+b.dataset.v);[...$(id).children].forEach(x=>x.classList.toggle("sel",x===b));});
  seg("#segL",v=>laps=v); seg("#segS",v=>lapTime=v);
  $("#optSim").addEventListener("change",e=>{sim=e.target.checked;syncSim();});
  $("#startBtn").addEventListener("click",()=>{audio();startRace();});
  $("#pickBtn2").addEventListener("click",()=>EscolherPresentes.abrir());
}
function showResult(){
  const st=standings(),won=st[0].isUs;
  $("#card").innerHTML=
    '<div class="logo">'+(won?"🏆🏎️":"😭🏁")+'</div><h2>'+(won?"Vitória!":"Perdemos!")+'</h2>'+
    '<p>'+(won?"O nosso carro cruzou a linha em primeiro.":"<b>"+esc(st[0].emoji+" "+st[0].name)+"</b> venceu. Nosso carro terminou em "+(st.indexOf(us)+1)+"º.")+'</p>'+
    '<div class="podium">'+st.map((c,i)=>'<div class="sr'+(c.isUs?" us":"")+'"><span class="ps">'+ord(i+1)+'</span><span class="dt" style="background:'+c.css+'"></span><span>'+c.emoji+" "+esc(c.name)+'</span><span class="lp">'+(i===0?"🏁":"")+'</span></div>').join("")+'</div>'+
    '<p>Placar da live: <b>🏆 '+wins+'</b> vitórias · <b>💀 '+losses+'</b> derrotas</p>'+
    '<button class="big" id="againBtn">Próxima corrida</button>'+
    '<button class="cbtn" id="menuBtn" style="margin-top:10px;width:100%">Configurações</button>';
  $("#overlay").hidden=false;
  const ab=$("#againBtn"),base=ab.textContent;let left=8;
  ab.textContent=base+" ("+left+")";
  ab.addEventListener("click",()=>{audio();startRace();});
  $("#menuBtn").addEventListener("click",showMenu);
  clearInterval(nextT);
  nextT=setInterval(()=>{
    if(state!=="finish"){clearInterval(nextT);return;}
    left--; if(left<=0){clearInterval(nextT);startRace();} else ab.textContent=base+" ("+left+")";
  },1000);
}

/* ================= torcida ================= */
let cheerCd=0;
const SHOUT_US=["VAI!","ACELERA!","UHUUU!","É NOSSO!","VAAAI!","BORA!"];
const SHOUT_RIV=["UHH!","OOH!","EITA!"];
const EMO=["👏","🎉","📣","🔥","❤️","🙌"];
const texCache={};
function bubbleTex(txt,hot){
  const k="b"+txt+hot; if(texCache[k]) return texCache[k];
  const cv=textCanvas(256,128),g=cv.getContext("2d");
  g.font='52px "Lilita One","Arial Black",sans-serif';
  const w=Math.min(244,g.measureText(txt).width+40);
  const fill=hot?"#ffd23f":"#ffffff";
  g.beginPath(); g.moveTo(116,86); g.lineTo(126,114); g.lineTo(142,86); g.closePath(); g.fillStyle=fill; g.fill(); g.lineWidth=5; g.strokeStyle="#222"; g.stroke();
  rr(g,(256-w)/2,8,w,80,30); g.fillStyle=fill; g.fill(); g.stroke();
  g.fillStyle="#222"; g.textAlign="center"; g.textBaseline="middle"; g.fillText(txt,128,50);
  return texCache[k]=new THREE.CanvasTexture(cv);
}
function emojiTex(e){
  const k="e"+e; if(texCache[k]) return texCache[k];
  const cv=textCanvas(128,128),g=cv.getContext("2d");
  g.font="96px serif"; g.textAlign="center"; g.textBaseline="middle"; g.fillText(e,64,70);
  return texCache[k]=new THREE.CanvasTexture(cv);
}
const shouts=[],wp=new THREE.Vector3();
function spawnShout(tex,w,h){
  const p=crowd[Math.floor(Math.random()*crowd.length)];
  p.g.getWorldPosition(wp);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,depthTest:false,opacity:0}));
  sp.scale.set(w,h,1); sp.renderOrder=6; sp.position.set(wp.x,wp.y+1.5,wp.z);
  scene.add(sp); shouts.push({sp,t:0,life:1.5+Math.random()*.6,vy:.8+Math.random()*.6,w,h});
}
function updateShouts(dt){
  for(let i=shouts.length-1;i>=0;i--){
    const s=shouts[i]; s.t+=dt; s.sp.position.y+=s.vy*dt;
    const pop=s.t<.15?s.t/.15:1;
    s.sp.scale.set(s.w*(.6+.4*pop),s.h*(.6+.4*pop),1);
    s.sp.material.opacity=s.t<.15?pop:Math.max(0,1-(s.t-.15)/(s.life-.15));
    if(s.t>=s.life){scene.remove(s.sp);s.sp.material.dispose();shouts.splice(i,1);}
  }
}
function cheer(car,big){
  const ours=!!(car&&car.isUs);
  excite=Math.max(excite,big?2.3:ours?2:1.1);
  if(cheerCd<=0||ours||big){sfx.cheer(big||ours?1:.5);cheerCd=1.2;}
  const n=big?16:ours?10:3;
  for(let i=0;i<n;i++) setTimeout(()=>{
    if(Math.random()<.55){const list=(ours||big)?SHOUT_US:SHOUT_RIV;spawnShout(bubbleTex(list[Math.floor(Math.random()*list.length)],ours||big),2.2,1.1);}
    else spawnShout(emojiTex(EMO[Math.floor(Math.random()*EMO.length)]),1.1,1.1);
  },i*90);
}
function checkStandPass(dt){
  cheerCd-=dt;
  if(state!=="race"&&state!=="finish") return;
  cars.forEach(c=>{
    const dx=c.g.position.x-standPos.x,dz=c.g.position.z-standPos.z;
    const near=dx*dx+dz*dz<225;
    if(near&&!c.nearStand&&!c.crash&&!c.tele) cheer(c,false);
    c.nearStand=near;
  });
}

/* ================= loop ================= */
const clock=new THREE.Clock();
function update(dt){
  T+=dt;
  if(state==="countdown"){
    cdT+=dt;
    const n=Math.min(5,Math.floor((cdT-.3)/.55)+1);
    const lights=[...$("#lights").children];
    if(cdT<3.4){
      if(cdT>.3&&n!==setGantry.n){setGantry.n=n;setGantry(n,false);lights.forEach((l,i)=>l.className=i<n?"r":"");sfx.beep();}
    } else {
      setGantry(5,true); lights.forEach(l=>l.className="g");
      state="race"; raceT=0; setGantry.n=0; sfx.go(); showBanner("VAI!","","gold"); cheer(null,true);
      setTimeout(()=>{if(state!=="countdown")$("#lights").classList.remove("on");},700);
      const q=pending; pending=[]; q.forEach(([e,u],i)=>setTimeout(()=>{if(state==="race")apply(e,u);},300+i*450));
    }
    cars.forEach(c=>updateCar(c,dt,"idle"));
  } else if(state==="race"){
    raceT+=dt; autoCycleT+=dt; forceChaseT=Math.max(0,forceChaseT-dt);
    rivalNitroT=Math.max(0,rivalNitroT-dt); us.nitroT=Math.max(0,us.nitroT-dt); us.revT=Math.max(0,us.revT-dt);
    if(raceT>2.5) setGantry(0,false);
    if(sim){simT-=dt;if(simT<=0){randomEvent();simT=1.1+Math.random()*2.6;}}
    cars.forEach(c=>updateCar(c,dt,"race"));
    // voltas e liderança
    const st=standings(),leader=st[0];
    const ul=Math.floor(us.p);
    if(ul>us.lastLap&&ul<laps){sfx.lap();}
    us.lastLap=ul;
    if(Math.floor(leader.p)===laps-1&&lastLapAnn!==laps-1&&laps>1){lastLapAnn=laps-1;showBanner("🔔 ÚLTIMA VOLTA!",leader.emoji+" "+leader.name+" na frente","gold");}
    if(lastLeader&&leader!==lastLeader&&raceT>3){
      if(leader.isUs){showBanner("⭐ ASSUMIMOS A PONTA!","Nosso carro é o 1º","good");excite=1.5;}
    }
    lastLeader=leader;
    const done=cars.filter(c=>c.p>=laps);
    if(done.length){done.forEach(c=>c.finished=true);endRace();}
  } else if(state==="finish"){
    finT+=dt;
    cars.forEach(c=>updateCar(c,dt,"cool"));
    if(finT>3.6&&!resultShown){resultShown=true;showResult();}
  } else {
    cars.forEach(c=>{if(!c.tele&&!c.crash)place(c);});
  }
  // multidão
  excite=Math.max(0,excite-dt*.45);
  const ex=.03+Math.min(excite,2.3)*.2;
  crowd.forEach(p=>{
    p.g.position.y=p.by+Math.abs(Math.sin(T*(6+excite*4)+p.ph))*ex;
    const up=excite>p.th;
    p.arms.forEach((a,i)=>{const sd=i?1:-1;const tg=up?sd*(2.6+Math.sin(T*13+p.ph+i*1.7)*.35):sd*.08;a.rotation.z+=(tg-a.rotation.z)*Math.min(1,dt*12);});
  });
  checkStandPass(dt); updateShouts(dt);
  if(us.g.userData.ring){us.g.userData.ring.rotation.z+=dt;us.g.userData.ring.material.opacity=.5+Math.sin(T*4)*.25;}
  camUpdate(dt);
  pumpLive(dt);
  updateBursts(dt);
  updateHud(dt);
  engineUpdate();
}
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta());
  update(dt);
  renderer.render(scene,camera);
}

/* ================= controles ================= */
window.addEventListener("keydown",e=>{
  if(e.repeat||(e.target&&e.target.tagName==="INPUT")) return;
  const k=e.key.toLowerCase();
  const ev=ALL.find(x=>x.key===k);
  if(ev){audio();relay(ev,"Espectador");trigger(ev,"Espectador");}
});
$("#btnSound").addEventListener("click",()=>{muted=!muted;$("#btnSound").innerHTML=muted?"🔇 <span>Mudo</span>":"🔊 <span>Som</span>";audio();if(bc)bc.postMessage({t:"mute",m:muted});});
function syncSim(){$("#btnSim").classList.toggle("on",sim);$("#btnSim").innerHTML="🤖 <span>Live simulada"+(sim?": ligada":"")+"</span>";const o=$("#optSim");if(o)o.checked=sim;}
$("#btnSim").addEventListener("click",()=>{sim=!sim;syncSim();});
const CAMS=[["auto","auto"],["chase","perseguição"],["tv","TV"],["aerial","aérea"]];
$("#btnCam").addEventListener("click",()=>{
  const i=(CAMS.findIndex(c=>c[0]===camMode)+1)%CAMS.length; camMode=CAMS[i][0];
  $("#btnCam").innerHTML="🎥 <span>Câmera: "+CAMS[i][1]+"</span>";
});

/* ================= TikFinity (presentes e seguidores reais) ================= */
const liveQueue=[]; let liveQT=0;
function findGift(name,id){id=Number(id);const n=String(name||"").toLowerCase().trim();return GIFTS.find(g=>id&&g.tid.includes(id))||GIFTS.find(g=>g.names.includes(n))||null;}
function cleanUser(u){return String(u||"Alguém").replace(/\s+/g," ").trim().slice(0,24)||"Alguém";}
function receive(ev,user,count){
  for(let i=0;i<Math.min(15,Math.max(1,Number(count)||1));i++) liveQueue.push([ev,cleanUser(user)]);
}
window.sendGift=(name,user,id,count,pic)=>{
  const g=findGift(name,id); if(!g) return false;
  if(pic&&/^https:\/\//.test(pic)&&g.img!==pic){g.img=pic;buildLegends();try{const sv=JSON.parse(localStorage.getItem("autoramaGiftIcons")||"{}");sv[g.id]=pic;localStorage.setItem("autoramaGiftIcons",JSON.stringify(sv));}catch(e){}}
  receive(g,user,count); return true;
};
window.sendFollow=user=>receive(EXTRA[0],user,1);
function pumpLive(dt){
  if(!liveQueue.length||(state!=="race"&&state!=="countdown")) return;
  liveQT-=dt; if(liveQT>0) return;
  const [ev,user]=liveQueue.shift(); trigger(ev,user); liveQT=.35;
}
function connectWS(){
  const url=PARAMS.get("ws")||"ws://localhost:21213/";
  let ws; try{ws=new WebSocket(url);}catch(e){return;}
  ws.onmessage=m=>{
    try{
      const d=JSON.parse(m.data),ev=d.event||d.type,data=d.data||d;
      if(ev==="gift"){ if(data.giftType===1&&data.repeatEnd===false) return; window.sendGift(data.giftName,data.nickname||data.uniqueId,data.giftId,data.repeatCount,data.giftPictureUrl); }
      else if(ev==="follow") window.sendFollow(data.nickname||data.uniqueId);
    }catch(e){}
  };
  ws.onclose=()=>setTimeout(connectWS,5000);
}
/* janela da live: o painel manda os testes para ela */
let bc=null; try{bc=new BroadcastChannel("autorama-live");}catch(e){}
function relay(ev,user){ if(bc&&!LIVE) bc.postMessage({t:"ev",id:ev.id,user}); }
if(bc&&LIVE) bc.onmessage=e=>{const m=e.data||{}; if(m.t==="ev"){const ev=ALL.find(x=>x.id===m.id); if(ev) receive(ev,m.user||"Você",1);} if(m.t==="mute"){muted=!!m.m;}};
$("#btnLive").addEventListener("click",()=>{window.open(location.pathname+"?obs=1"+(PARAMS.get("ws")?"&ws="+encodeURIComponent(PARAMS.get("ws")):""),"autorama-live","width=540,height=960");});
setTimeout(()=>{if(!ac||ac.state!=="running")$("#tapSound").classList.add("show");},900);
document.addEventListener("pointerdown",()=>{audio();setTimeout(()=>{if(ac&&ac.state==="running")$("#tapSound").classList.remove("show");},120);});

if(window.EscolherPresentes){

if(LIVE){ sim=PARAMS.get("sim")==="1"; laps=clamp(parseInt(PARAMS.get("voltas"),10)||laps,1,20); lapTime=clamp(parseFloat(PARAMS.get("tempo"))||lapTime,6,40); syncSim(); audio(); startRace(); } else showMenu();   // ?voltas=3&tempo=11 muda a corrida da janela da live
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>labels.forEach(d=>d()));
loop();
})();
