name: Buscar voos

on:
  issues:
    types: [opened, reopened, edited, labeled]
  schedule:
    - cron: '23 * * * *'   # de hora em hora
  workflow_dispatch:
    inputs:
      rota:
        description: 'Número da issue ou título "Voo LIS RIO 2026-12-17 2027-01-02" (vazio = todas)'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: voos
  cancel-in-progress: false

jobs:
  buscar:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'voo')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: _voos
        run: npm ci --no-audit --no-fund
      - name: Buscar
        working-directory: _voos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROTA: ${{ github.event.issue.number || github.event.inputs.rota }}
        run: node rotas.js "$ROTA"
      - name: Publicar
        run: |
          git config user.name "robo-voos"
          git config user.email "robo-voos@users.noreply.github.com"
          git add dados
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza voos"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
