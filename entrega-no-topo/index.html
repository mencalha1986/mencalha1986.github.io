<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrega no Topo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120830;
  --panel:rgba(255,255,255,.88);
  --panel-2:rgba(40,20,90,.07);
  --line:rgba(40,20,90,.16);
  --text:#1b1035;
  --muted:#5d5482;
  --good:#0b9e60;
  --bad:#d91e48;
  --pkg:#ffb703;
  --red:#e63946;
  --overlay:rgba(18,8,48,.55);
  --hud-text:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:rgba(18,9,46,.78);
    --panel-2:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.13);
    --text:#ffffff;
    --muted:#bdb3ef;
    --good:#2ee59d;
    --bad:#ff4d73;
    --overlay:rgba(8,3,24,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:rgba(18,9,46,.78);
  --panel-2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.13);
  --text:#ffffff;
  --muted:#bdb3ef;
  --good:#2ee59d;
  --bad:#ff4d73;
  --overlay:rgba(8,3,24,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pkg);outline-offset:2px}

/* top bar */
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:290px;right:330px;max-width:560px;margin:0 auto;padding:10px 14px 12px;pointer-events:none;z-index:5}
#top .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
#top h1{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:22px;margin:0;letter-spacing:.3px;line-height:1}
#top h1 span{color:var(--pkg);-webkit-text-stroke:0}
#order{font-size:13px;color:var(--muted);font-weight:800;white-space:nowrap}
.bar{height:26px;border-radius:999px;background:var(--panel-2);overflow:hidden;position:relative;border:1px solid var(--line)}
#barFill{height:100%;width:0;background:linear-gradient(90deg,#22e08a,#ffd23f 40%,#ff5ea8 75%,#8b5cf6)}
#barText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Lilita One",Nunito,sans-serif;font-size:17px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7),0 0 6px rgba(0,0,0,.35)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;min-height:0}
.chip{font-size:12.5px;font-weight:900;padding:3px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.chip.hidden{display:none}
.chip.g{color:var(--good)} .chip.b{color:var(--bad)}

/* left column */
#left{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:265px;display:flex;flex-direction:column;gap:10px;z-index:4;pointer-events:none}
#stats{padding:9px 14px;font-weight:900;font-size:14px;display:flex;justify-content:space-between}
#feedWrap{padding:10px 10px 6px}
.ttl{font-family:"Lilita One",Nunito,sans-serif;font-size:15px;margin:0 4px 6px;color:var(--muted);font-weight:400}
#feed{display:flex;flex-direction:column;gap:5px}
#feed:empty::after{content:"Os presentes da live aparecem aqui.";font-size:13px;color:var(--muted);padding:4px 4px 6px;display:block}
.fi{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:10px;background:var(--panel-2);border-left:4px solid var(--good);animation:fin .35s ease-out}
.fi.bad{border-left-color:var(--bad)}
.fi.blk{border-left-color:#38bdf8}
.fi .fe{font-size:20px;line-height:1}
.fi b{font-weight:900}
.fi small{display:block;color:var(--muted);font-weight:700;font-size:11.5px}
@keyframes fin{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
#rank{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12.5px}
#rank .col div{display:flex;justify-content:space-between;gap:4px;padding:2px 0;font-weight:800}
#rank .col div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rank .col .none{color:var(--muted);font-weight:700}
#rank .hg{color:var(--good)} #rank .hb{color:var(--bad)}
#rank #rHelp,#rank #rSab{display:block;padding:0}

/* gifts */
#gifts{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:310px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:12px;z-index:6}
#gifts header{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}
#gifts h2{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:19px;margin:0}
#giftClose{display:none;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:900}
.gsec{font-weight:900;font-size:13px;margin:10px 4px 6px;color:var(--muted)}
.glist{display:grid;gap:6px}
.gift{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;text-align:left;padding:7px 9px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);border-left:5px solid var(--good);transition:transform .08s}
.gift.bad{border-left-color:var(--bad)}
.gift:active{transform:scale(.97)}
.gift:hover{border-color:var(--muted)}
.gift .ge{font-size:24px;text-align:center}
.gift .gn{font-weight:900;font-size:14px;line-height:1.15}
.gift .gn small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.gift .gc{text-align:right;font-weight:900;font-size:13px;white-space:nowrap}
.gift kbd{display:block;font-family:inherit;font-size:10.5px;color:var(--muted);text-align:right;font-weight:800}

/* climb button */
#climb{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:118px;height:118px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle at 35% 30%,#7dffc2,#12c873 55%,#07894d);color:#fff;font-family:"Lilita One",Nunito,sans-serif;font-size:24px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 8px 0 #05673a,0 14px 30px rgba(0,0,0,.45);z-index:5;touch-action:manipulation;display:none}
#climb span{display:block;font-size:34px}
#climb:active,#climb.press{transform:translateX(-50%) translateY(5px);box-shadow:0 3px 0 #05673a,0 8px 20px rgba(0,0,0,.4)}
#climb.stun{background:radial-gradient(circle at 35% 30%,#c9c9c9,#8a8a8a 55%,#5a5a5a);box-shadow:0 8px 0 #3d3d3d,0 14px 30px rgba(0,0,0,.45)}
body.playing #climb{display:none}

/* banner */
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.6);text-align:center;pointer-events:none;opacity:0;z-index:7;width:min(92vw,720px)}
#banner.show{animation:pop 2.1s ease-out forwards}
#banner .bt{font-family:"Lilita One",Nunito,sans-serif;font-size:clamp(40px,8vw,78px);line-height:1;color:var(--hud-text);-webkit-text-stroke:3px rgba(0,0,0,.55);paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.35)}
#banner.good .bt{color:#3ff5a6} #banner.bad .bt{color:#ff5a7d} #banner.blk .bt{color:#5fd4ff} #banner.gold .bt{color:#ffd23f}
#banner .bs{margin-top:6px;font-weight:900;font-size:clamp(15px,2.6vw,20px);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.9)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}

/* corner controls */
#corner{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;z-index:6}
.cbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:900;font-size:13.5px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.cbtn.on{border-color:var(--good);color:var(--good)}
#giftToggle{display:none;position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:6;font-size:15px}

/* overlay */
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:var(--overlay);z-index:10;padding:16px}
#overlay.hidden{display:none}
.card{width:min(460px,100%);padding:26px 24px 22px;text-align:center;max-height:100%;overflow:auto}
.card .logo{font-size:54px;line-height:1;margin-bottom:6px}
.card h2{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:40px;margin:0 0 8px;line-height:1}
.card p{margin:0 0 14px;color:var(--muted);font-weight:700;line-height:1.45;font-size:15px}
.card p b{color:var(--text)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:2px 0 12px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:900;font-size:14px}
.seg button.sel{background:var(--red);color:#fff}
.lbl{font-weight:900;font-size:13.5px;margin-bottom:4px}
.check{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:16px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--red)}
.big{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:var(--red);color:#fff;font-family:"Lilita One",Nunito,sans-serif;font-size:22px;box-shadow:0 5px 0 #a3202c}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #a3202c}
.hint{font-size:12.5px!important;margin:14px 0 0!important}
.hint kbd{font-family:inherit;font-weight:900;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--text)}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.rstats div{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.rstats b{display:block;font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:24px}
.rstats span{font-size:12px;color:var(--muted);font-weight:800}

@media (max-width:980px){
  #top{left:10px;right:10px;max-width:none}
  #top h1{font-size:19px}
  #left{top:calc(env(safe-area-inset-top,0px) + 102px);left:8px;width:min(220px,56vw);gap:6px}
  #rank{display:grid;padding:6px 8px;gap:6px;font-size:11.5px}
  #stats{font-size:12.5px;padding:6px 10px}
  #feedWrap{padding:6px;background:transparent;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
  #feedWrap .ttl{display:none}
  #feed:empty::after{display:none}
  .fi{background:var(--panel);font-size:12px;padding:5px 7px}
  .fi small{display:none}
  #gifts{left:0;right:0;top:auto;bottom:0;width:auto;max-height:64%;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .25s ease;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:8}
  #gifts.open{transform:none}
  #giftClose{display:block}
  .glist{grid-template-columns:1fr 1fr}
  .gift{grid-template-columns:28px 1fr;gap:6px}
  .gift .ge{font-size:21px}
  .gift .gc{grid-column:2;text-align:left;font-size:12px}
  .gift kbd{display:none}
  #giftToggle{display:block}
  #climb{width:104px;height:104px;font-size:21px}
  #climb span{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  #banner.show{animation-duration:2.1s}
  .fi{animation:none}
}

/* balão de fala do entregador */
#say{position:fixed;left:0;top:0;transform:translate(-50%,-100%) scale(.7);opacity:0;pointer-events:none;z-index:6;background:#fff;color:#1d1636;font-weight:800;font-size:17px;line-height:1.2;padding:8px 13px;border-radius:16px;border:3px solid #1d1636;max-width:250px;width:max-content;text-align:center;transition:opacity .2s,transform .25s cubic-bezier(.3,1.5,.6,1)}
#say.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
#say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-9px;border:9px solid transparent;border-top-color:#1d1636}
#tapSound{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#ffb703;color:#1d1636;font-weight:800;font-size:18px;padding:9px 16px;border-radius:999px;z-index:30;cursor:pointer;display:none;white-space:nowrap}
#tapSound.show{display:block}

/* ícones oficiais dos presentes */
img.li{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
span.li.emo{font-size:52px}
.fi .fe{width:24px;height:24px;object-fit:contain;flex-shrink:0}
.fi span.fe.emo{font-size:20px;width:auto;height:auto}
#banner .bi{width:clamp(48px,9vw,86px);height:clamp(48px,9vw,86px);object-fit:contain;vertical-align:middle;margin-right:8px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
#banner span.bi.emo{font-size:clamp(40px,8vw,72px);width:auto;height:auto}

/* ===== JANELA DA LIVE (?obs=1): palco fixo 9:16 (540×960), igual em qualquer tamanho de janela ===== */
.live #top{left:10px;right:10px;max-width:none}
.live #top h1{font-size:19px}
.live #left{top:calc(env(safe-area-inset-top,0px) + 102px);left:8px;width:min(220px,56vw);gap:6px}
.live #rank{display:grid;padding:6px 8px;gap:6px;font-size:11.5px}
.live #stats{font-size:12.5px;padding:6px 10px}
.live #feedWrap{padding:6px;background:transparent;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.live #feedWrap .ttl{display:none}
.live #feed:empty::after{display:none}
.live .fi{background:var(--panel);font-size:12px;padding:5px 7px}
.live .fi small{display:none}
.live #gifts{left:0;right:0;top:auto;bottom:0;width:auto;max-height:64%;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .25s ease;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:8}
.live #gifts.open{transform:none}
.live #giftClose{display:block}
.live .glist{grid-template-columns:1fr 1fr}
.live .gift{grid-template-columns:28px 1fr;gap:6px}
.live .gift .ge{font-size:21px}
.live .gift .gc{grid-column:2;text-align:left;font-size:12px}
.live .gift kbd{display:none}
.live #giftToggle{display:block}
.live #climb{width:104px;height:104px;font-size:21px}
.live #climb span{font-size:30px}
.live .legend{top:calc(env(safe-area-inset-top,0px) + 108px);gap:4px}
.live #legBad{left:4px}
.live #legGood{right:4px}
.live .li{font-size:38px}
.live img.li{width:44px;height:44px}
.live span.li.emo{font-size:36px}
.live .li.gg{font-size:32px}
.live .ln{font-size:20px;-webkit-text-stroke:4px #2a1a00}
.live .leg kbd{display:none}
.live #left{right:auto;left:6px;transform:none;top:calc(env(safe-area-inset-top,0px) + 330px);bottom:auto;width:min(170px,34vw)}
.live #rank{grid-template-columns:1fr!important}
.live #stats{flex-direction:column;gap:2px}
.live #feed .fi:nth-child(n+4){display:none}
.live #corner .cbtn span{display:none}
.live body{background:#000}
.live #stage{position:fixed;left:50%;top:50%;width:540px;height:960px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:var(--bg)}
/* áreas livres do TikTok: topo (nome/perfil) e rodapé (botões) ficam limpos */
.live #top{top:128px!important;left:12px;right:12px}
.live .legend{top:216px!important;gap:2px}
.live #left{top:424px!important}
.live #banner{top:32%}
.live #feed .fi:nth-child(n+4){display:none}

/* modo live (?obs=1): só o jogo, sem botões de operador */
.live #corner,.live #climb,.live .leg kbd,.live #giftToggle{display:none!important}
.live #overlay{background:rgba(8,3,24,.35)}
.live .card .big,.live .card .cbtn{pointer-events:none}

/* legenda de presentes nas laterais, estilo live */
.legend{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:10px;z-index:6}
#legBad{left:12px;align-items:flex-start}
#legGood{right:12px;align-items:flex-end}
.leg{position:relative;display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 6px;border-radius:14px;transition:transform .1s}
.leg:hover{transform:scale(1.06)}
.leg:active{transform:scale(.93)}
.li{font-size:56px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.li.gg{font-family:"Lilita One",Nunito,sans-serif;font-size:50px;background:linear-gradient(180deg,#ff5ea8,#ffd23f 45%,#22e0c8 70%,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #3a1050;padding:0 2px}
.ln{font-family:"Lilita One",Nunito,sans-serif;font-size:30px;line-height:.95;color:#ffe14d;-webkit-text-stroke:5px #2a1a00;paint-order:stroke fill;text-align:left}
#legGood .ln{text-align:right}
.leg kbd{position:absolute;bottom:-4px;font-family:inherit;font-size:10.5px;font-weight:900;color:#fff;background:rgba(0,0,0,.5);border-radius:5px;padding:0 5px}
#legBad .leg kbd{left:4px}
#legGood .leg kbd{right:4px}
#left{left:auto;right:12px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:260px}
#feed .fi:nth-child(n+5){display:none}
@media (max-width:980px){
  .legend{top:calc(env(safe-area-inset-top,0px) + 108px);gap:4px}
  #legBad{left:4px}
  #legGood{right:4px}
  .li{font-size:38px}
  img.li{width:44px;height:44px}
  span.li.emo{font-size:36px}
  .li.gg{font-size:32px}
  .ln{font-size:20px;-webkit-text-stroke:4px #2a1a00}
  .leg kbd{display:none}
  #left{right:auto;left:6px;transform:none;top:calc(env(safe-area-inset-top,0px) + 330px);bottom:auto;width:min(170px,34vw)}
  #rank{grid-template-columns:1fr!important}
  #stats{flex-direction:column;gap:2px}
  #feed .fi:nth-child(n+4){display:none}
  #corner .cbtn span{display:none}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="panel">
  <div class="row"><h1>Entrega no <span>Topo</span></h1><div id="order">Pedido #0000</div></div>
  <div class="bar"><div id="barFill"></div><div id="barText">0 / 1000</div></div>
  <div class="chips">
    <span id="chipTurbo" class="chip g hidden"></span>
    <span id="chipShield" class="chip g hidden"></span>
    <span id="chipStun" class="chip b hidden"></span>
  </div>
</div>

<div id="left">
  <div id="stats" class="panel"><span id="sWins">🏆 0 entregas</span><span id="sTime">⏱ 00:00</span></div>
  <div id="feedWrap" class="panel"><div class="ttl">Presentes recentes</div><div id="feed"></div></div>
  <div id="rank" class="panel">
    <div class="col"><div class="hg" style="font-weight:900">💚 Ajudaram</div><div id="rHelp"></div></div>
    <div class="col"><div class="hb" style="font-weight:900">💔 Sabotaram</div><div id="rSab"></div></div>
  </div>
</div>

<div id="legBad" class="legend" aria-label="Presentes que fazem descer"></div>
<div id="legGood" class="legend" aria-label="Presentes que fazem subir"></div>

<button id="climb" aria-label="Subir um degrau"><span>⬆</span>SUBIR</button>
<div id="say"></div>

const stars=(function(){
  const n=2600,pa=new Float32Array(n*3),ca=new Float32Array(n*3),c=new THREE.Color();
  for(let i=0;i<n;i++){
    const u=Math.random()*2-1,th=Math.random()*Math.PI*2,r=260+Math.random()*260,s=Math.sqrt(1-u*u);
    pa[i*3]=r*s*Math.cos(th); pa[i*3+1]=r*u; pa[i*3+2]=r*s*Math.sin(th);
    c.setHSL(Math.random()<.7?0.7:Math.random(),0.6,0.75+Math.random()*.25);
    ca[i*3]=c.r; ca[i*3+1]=c.g; ca[i*3+2]=c.b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pa,3));
  g.setAttribute("color",new THREE.BufferAttribute(ca,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({size:1.5,vertexColors:true,fog:false,transparent:true,opacity:.95,depthWrite:false}));
  scene.add(p); return p;
})();

const RISE=0.42,DEPTH=1.35,WIDTH=5.2,POOL=150;

function buildPath(n){
  P=[]; let x=0,z=0;
  for(let i=0;i<=n+40;i++){
    const a=Math.sin(i/80)*0.85+Math.sin(i/27+1)*0.18;
    P.push({x,y:i*RISE,z,a});
    x+=Math.sin(a)*DEPTH; z-=Math.cos(a)*DEPTH;
  }
}

const bursts=[];
function burst(pos,color,count,speed,life,size){
  count=count||50; speed=speed||6; life=life||1.1;
  const pa=new Float32Array(count*3),ca=new Float32Array(count*3),vel=new Float32Array(count*3),c=new THREE.Color();
  for(let i=0;i<count;i++){
    pa[i*3]=pos.x+(Math.random()-.5)*.6; pa[i*3+1]=pos.y+1+Math.random()*.8; pa[i*3+2]=pos.z+(Math.random()-.5)*.6;
    let vx=Math.random()*2-1,vy=Math.random()*1.3+.2,vz=Math.random()*2-1; const l=Math.hypot(vx,vy,vz)||1,s=speed*(.35+Math.random()*.65);
    vel[i*3]=vx/l*s; vel[i*3+1]=vy/l*s; vel[i*3+2]=vz/l*s;
    if(color==null) c.setHSL(Math.random(),1,.6); else c.set(color);
    ca[i*3]=c.r; ca[i*3+1]=c.g; ca[i*3+2]=c.b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pa,3));
  g.setAttribute("color",new THREE.BufferAttribute(ca,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:size||.32,vertexColors:true,transparent:true,depthWrite:false}));
  scene.add(pts); bursts.push({pts,vel,life,t:0,count});
}
function updateBursts(dt){
  for(let b=bursts.length-1;b>=0;b--){
    const B=bursts[b]; B.t+=dt;
    const pa=B.pts.geometry.attributes.position.array;
    for(let i=0;i<B.count;i++){B.vel[i*3+1]-=7*dt; pa[i*3]+=B.vel[i*3]*dt; pa[i*3+1]+=B.vel[i*3+1]*dt; pa[i*3+2]+=B.vel[i*3+2]*dt;}
    B.pts.geometry.attributes.position.needsUpdate=true;
    B.pts.material.opacity=Math.max(0,1-B.t/B.life);
    if(B.t>=B.life){scene.remove(B.pts);B.pts.geometry.dispose();B.pts.material.dispose();bursts.splice(b,1);}
  }
}

function tone(f,d,type,v,when,f2){
  if(!ac||muted) return;
  const t0=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(v||.08,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+d+.03);
}

/* ---------- música de fundo (melodia original, gerada pelo jogo) ---------- */
let musicBus=null,mNext=0,mStep=0,musicDuck=1;
const NF=n=>{const m=/^([A-G])(#?)(\d)$/.exec(n);const i={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(i+(Number(m[3])-4)*12-9)/12);};
// 8 compassos em colcheias (em Sol maior, animado)
const TUNE=[["G4",1],["B4",1],["D5",1],["B4",1],["G5",2],["D5",2],["E5",1],["D5",1],["C5",1],["B4",1],["A4",4],
            ["F#4",1],["A4",1],["C5",1],["A4",1],["D5",2],["C5",1],["B4",1],["A4",1],["B4",1],["C5",1],["A4",1],["G4",4],
            ["B4",1],["C5",1],["D5",2],["G5",2],["F#5",1],["E5",1],["D5",2],["B4",1],["G4",1],["A4",4],
            ["C5",1],["E5",1],["D5",1],["C5",1],["B4",2],["A4",2],["D5",1],["C5",1],["B4",1],["A4",1],["G4",4]];
const TUNE_T=[];{let t=0;TUNE.forEach(([n,d])=>{TUNE_T.push([t,n,d]);t+=d;});}
const HARM=[["G2","B3","D4"],["C3","C4","E4"],["D3","D4","F#4"],["G2","B3","D4"],["G2","B3","D4"],["C3","C4","E4"],["D3","A3","D4"],["G2","B3","D4"]];
const M8=60/132/2;
function mn(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+d+.04);}
function musicLevel(f){if(!musicBus)return;const t=ac.currentTime,v=muted?0:.5*musicDuck;musicBus.gain.cancelScheduledValues(t);musicBus.gain.setValueAtTime(musicBus.gain.value,t);musicBus.gain.linearRampToValueAtTime(v,t+(f||.4));}
function musicTick(){
  if(!ac||ac.state!=="running")return;
  if(!musicBus){musicBus=ac.createGain();musicBus.gain.value=0;musicBus.connect(ac.destination);mNext=ac.currentTime+.1;musicLevel(1.5);}
  while(mNext<ac.currentTime+.25){
    const st=mStep%64,t=mNext,ib=st%8,h=HARM[Math.floor(st/8)];
    if(!muted){
      TUNE_T.forEach(([t0,n,d])=>{if(t0===st){mn(NF(n),t,d*M8*.9,"square",.035);mn(NF(n),t,d*M8*.9,"triangle",.09);}});
      if(ib%2===0) mn(NF(ib%4===0?h[0]:h[0].replace(/\d/,m=>String(Number(m)+1))),t,M8*1.6,"triangle",.17);   // baixo pulando de oitava
      if(ib%2===1) h.slice(1).forEach(n=>mn(NF(n),t,M8*.8,"triangle",.035));                                   // acordes no contratempo
      if(ib%4===0) mn(70,t,.18,"sine",.22);                                                                     // bumbo
      mn(5200,t,.025,"square",ib%2?.008:.004);                                                                  // chimbal
    }
    mStep++;mNext+=M8;
  }
}

const boulder=(()=>{
  const geo=new THREE.IcosahedronGeometry(1.25,2), pa=geo.attributes.position, v=new THREE.Vector3();
  for(let i=0;i<pa.count;i++){v.fromBufferAttribute(pa,i);const n=1+.09*Math.sin(v.x*3.1+v.y*1.7)+.07*Math.cos(v.z*2.6-v.x*1.3)+.04*Math.sin(v.y*5.3+v.z*4.1);v.multiplyScalar(n);pa.setXYZ(i,v.x,v.y,v.z);}
  geo.computeVertexNormals();
  const col=[], c=new THREE.Color();
  for(let i=0;i<pa.count;i+=3){ const k=.55+Math.random()*.25; c.setRGB(.48*k,.40*k,.32*k); for(let j=0;j<3;j++) col.push(c.r,c.g,c.b); }   // pedra com manchas
  geo.setAttribute("color",new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0,flatShading:true}));
  m.visible=false; scene.add(m); return m;
})();
let rock=null, camShake=0;   // rock: {pos, phase:'in'|'push'|'out', target, delta, t}
function rockPoint(idx){const p=posAt(idx);return new THREE.Vector3(p.x,p.y+1.25,p.z);}
function rumble(){ if(!ac||muted) return; tone(55,1.4,"sawtooth",.05,0,40); tone(80,1.2,"triangle",.07,.1,45); }
function launchRock(delta,zero){
  if(rock&&rock.phase!=="out"){ rock.delta+=delta; if(zero) rock.zero=true; if(rock.phase==="push") applyRockHit(); return; }
  const from=Math.min(N,vis+14);
  rock={pos:from,phase:"in",delta,zero:!!zero,t:0,big:zero||Math.abs(delta)>=100};
  boulder.scale.setScalar(rock.big?1.25:1); boulder.visible=true; boulder.position.copy(rockPoint(from)); rumble();
}
function applyRockHit(){
  step=rock.zero?0:clamp(step+rock.delta,0,N); rock.delta=0; rock.zero=false;
}
function updateRock(dt){
  if(camShake>0) camShake=Math.max(0,camShake-dt*2.2);
  if(!rock) return;
  rock.t+=dt; const prev=boulder.position.clone();
  if(rock.phase==="in"){
    rock.pos-=dt*(9+rock.t*10);
    if(rock.pos<=vis+.9){   // bateu!
      rock.pos=vis+.9; rock.phase="push"; applyRockHit(); camShake=1; sfx.crash();
      burst(courierWorld(),0x9c8466,90,8,1.1,.35);
    }
  } else if(rock.phase==="push"){
    rock.pos=vis+.9;
    if(Math.abs(step-vis)<.6){ rock.phase="out"; rock.t=0; }
  } else {
    rock.pos-=dt*14; boulder.scale.multiplyScalar(Math.max(.2,1-dt*1.6));
    if(rock.t>.8||rock.pos<0){ burst(boulder.position.clone(),0x9c8466,50,6,.9,.3); boulder.visible=false; rock=null; return; }
  }
  const sc=boulder.scale.x;
  const np=rockPoint(Math.max(0,rock.pos)); np.y+=(sc-1)*1.25;
  boulder.position.copy(np);
  const mv=np.clone().sub(prev), dist=mv.length();
  if(dist>1e-4){ const axis=new THREE.Vector3(0,1,0).cross(mv).normalize(); boulder.rotateOnWorldAxis(axis,dist/(1.25*sc)); }
}

function applyGift(g,user){
  if(state!=="play") return;
  const pos=courierWorld();
  if(g.type==="bad"&&shield>0&&g.kind!=="cancel"){
    shield--; cntBad++; sab[user]=(sab[user]||0)+Math.abs(g.n||0);
    addFeed(g,user,true); renderRank();
    showBanner("🛡️ BLOQUEADO!",user+" tentou "+g.name,"blk");
    burst(pos,0x7dd3fc,70,7); sfx.block(); return;
  }
  addFeed(g,user,false);
  if(g.type==="good") cntGood++; else cntBad++;
  const before=step;
  const tally=()=>{const d=step-before; if(d>0) help[user]=(help[user]||0)+d; else if(d<0) sab[user]=(sab[user]||0)-d; renderRank();};
  switch(g.kind){
    case "move":{
      if(g.n<0){   // pedra rolando leva o entregador escada abaixo
        const d=Math.max(-step,g.n); sab[user]=(sab[user]||0)-d; renderRank();
        showBanner("−"+Math.abs(d),user+" mandou "+g.name,g.type,g);
        launchRock(g.n,false); break;
      }
      step=clamp(step+g.n,0,N); const d=step-before, big=Math.abs(g.n)>=100; tally();
      showBanner((d>=0?"+":"−")+Math.abs(d),user+" mandou "+g.name,g.type,g);
      burst(pos,g.type==="good"?0x3ff5a6:0xff5a7d,big?120:55,big?9:6);
      if(g.type==="good"&&d>=100){tele={t:0,swapped:false}; sfx.whoosh();}
      else if(g.type==="good") sfx.good(); else sfx.bad();
      break;
    }
    case "top":
      step=N; tally(); tele={t:0,swapped:false};
      showBanner("SOBE TUDO!",user+" mandou direto pro topo","gold",g);
      burst(pos,0xff7ad9,170,10,1.5); sfx.whoosh(); break;
    case "teleport":{
      const before=step; step=clamp(step+g.n,0,N);
      tele={t:0,swapped:false};
      showBanner("🌀 +"+(step-before),user+" abriu um portal!","good");
      burst(pos,0xb57bff,120,8,1.3); sfx.whoosh(); break;
    }
    case "turbo":
      turboT+=g.s; showBanner("☕ TURBO!",user+" pagou um cafezinho","good"); burst(pos,0xffb703,50,5); sfx.good(); break;
    case "shield":
      shield++; showBanner("🛡️ ESCUDO!",user+" protegeu o entregador","blk"); burst(pos,0x38bdf8,60,6); sfx.good(); break;
    case "stun":
      stunT=Math.max(stunT,g.s); showBanner("🐕 AU AU!",user+" soltou o cachorro","bad"); burst(pos,0xff5a7d,40,5); sfx.bark(); break;
    case "zero":
      sab[user]=(sab[user]||0)+step; renderRank();
      showBanner("VOLTA TUDO!",user+" mandou de volta ao degrau 0","bad",g); launchRock(0,true); break;
    case "cancel":
      gameOver(user); break;
  }
}

function randomGift(){
  const w=GIFTS.map(g=>g.w);
  const tot=w.reduce((a,b)=>a+b,0); let r=Math.random()*tot,i=0;
  while(r>w[i]){r-=w[i];i++;}
  applyGift(GIFTS[Math.min(i,GIFTS.length-1)],NAMES[Math.floor(Math.random()*NAMES.length)]);
}

  courier.pivot.scale.setScalar(1); courier.pivot.rotation.set(0,0,0); courier.g.rotation.set(0,0,0);
  backpack.visible=true;
}
function setupWorld(n){
  N=n; buildPath(N); rebuildTop(); rebuildDecor();
  slots.forEach(s=>s.idx=-1);
}
function startGame(){
  if(chosenN!==N) setupWorld(chosenN); else {rebuildTop(); slots.forEach(s=>s.idx=-1);}
  step=0; vis=0; prevVis=0; turboT=0; stunT=0; shield=0; climbCd=0; tele=null; holding=false; restT=0; lastRest=0; sayT=0; rock=null; boulder.visible=false; camShake=0;
  elapsed=0; help={}; sab={}; cntGood=0; cntBad=0; simT=2;

/* ---------- loop ---------- */
const clock=new THREE.Clock();
function update(dt){
  T+=dt;
  if(state==="play"){
    elapsed+=dt;
    turboT=Math.max(0,turboT-dt); stunT=Math.max(0,stunT-dt); climbCd=Math.max(0,climbCd-dt);
    restT=Math.max(0,restT-dt);
    if(!tele&&restT<=0){autoAcc+=dt*autoRate; while(autoAcc>=1){autoAcc-=1; if(step<N) step++;}}
    // a cada 100 degraus ele para, respira e reclama
    const hund=Math.floor(vis/100);
    if(hund<lastRest) lastRest=hund;
    else if(hund>lastRest&&!tele&&Math.abs(step-vis)<1.5&&step<N-5){
      lastRest=hund; restT=3.2; autoAcc=0;
      sayCourier(TIRED[Math.floor(Math.random()*TIRED.length)].replace("{n}",hund*100),3.2);
      tone(330,.6,"sine",.07,0,190); tone(300,.5,"sine",.05,.7,170);
    }
    if(sim){simT-=dt; if(simT<=0){randomGift(); simT=1.2+Math.random()*2.8;}}
    pumpQueue(dt);
  }
  updateRock(dt);
  prevVis=vis;
  if(state==="play"||state==="menu"){
    if(tele){
      tele.t+=dt; const t=tele.t;
      if(t<.45){courier.pivot.scale.setScalar(Math.max(.01,1-t/.45)); courier.pivot.rotation.y+=dt*28;}
      else{
        if(!tele.swapped){tele.swapped=true; vis=step; prevVis=vis; snapCam=true; burst(courierWorld(),0xb57bff,120,8,1.3); tone(1400,.3,"triangle",.06,0,500);}
        const s=Math.min(1,(t-.45)/.4); courier.pivot.scale.setScalar(Math.max(.01,s)); courier.pivot.rotation.y+=dt*28*(1-s);
      }
      if(t>=.85){tele=null; courier.pivot.scale.setScalar(1); courier.pivot.rotation.y=0;}
    } else {
      const diff=step-vis;
      if(Math.abs(diff)>1e-4){
        const sp=rock&&rock.phase==="push"?Math.max(18,Math.abs(diff)*2):Math.max(turboT>0?13:7.5,Math.abs(diff)*3.2),mv=Math.min(Math.abs(diff),sp*dt);
        vis+=Math.sign(diff)*mv; if(Math.abs(step-vis)<1e-4) vis=step;
        if(Math.floor(vis)!==Math.floor(prevVis)&&Math.abs(diff)<8) sfx.step();
      }
    }
    if(state==="play"&&!tele&&step>=N&&vis>=N-1e-3) startWin();
  }

  // pose do entregador
  const tumbling=state==="play"&&!tele&&(step-vis)<-4;
  if(state==="play"||state==="menu"){
    const p=posAt(vis);
    courier.g.position.set(p.x,p.y+(Math.abs(vis-prevVis)>1e-5?p.hop:0),p.z);
    courier.g.rotation.y=-p.a;
    focus.set(p.x,p.y,p.z);
    const spd=Math.abs(vis-prevVis)/Math.max(dt,1e-4);
    walkPhase+=Math.min(spd,14)*dt*Math.PI;
    const amp=spd>.2?.75:0, sw=Math.sin(walkPhase)*amp;
    animLimbs(courier,sw,dt);
    if(tumbling){courier.pivot.rotation.x+=dt*16;}
    else if(!tele){courier.pivot.rotation.x*=Math.max(0,1-dt*12); if(Math.abs(courier.pivot.rotation.x)>Math.PI*2) courier.pivot.rotation.x%=Math.PI*2;}
    courier.pivot.rotation.z=stunT>0?Math.sin(T*22)*.14:0;
    if(!sweatSprite.parent){sweatSprite.position.set(.45,2.5,0);courier.g.add(sweatSprite);}
    const resting=restT>0&&state==="play"&&!tele&&!tumbling;
    sweatSprite.visible=resting; if(resting){sweatSprite.position.y=2.5+Math.sin(T*6)*.08; courier.pivot.rotation.x=.22+Math.sin(T*5)*.05;}
    shadow.visible=!tele;
    const si=Math.round(clamp(vis,0,N)); shadow.position.set(p.x,P[si].y+.02,p.z);
  }
  if(state==="win"){
    winT+=dt;
    const k=Math.min(1,winT/1.6);
    courier.g.position.lerpVectors(winFrom,winTo,k); courier.g.position.y=topY+(k<1?Math.abs(Math.sin(winT*9))*.15:0);
    animLimbs(courier,k<1?Math.sin(winT*14)*.75:0,dt);
    courier.pivot.rotation.set(0,0,0);
    if(k>=1&&!delivered){
      delivered=true; backpack.visible=false; customerBox.visible=true;
      const cp=topGroup.localToWorld(new THREE.Vector3(0,0,-.4));
      burst(cp,null,260,12,2.4,.4); burst(cp,null,160,8,2,.3);
      showBanner("📦 ENTREGUE!","Pedido #"+orderId+" entregue no topo","gold"); sfx.win();
    }
    if(delivered){
      courier.parts.armL.rotation.z=-2.5-Math.sin(T*8)*.4; courier.parts.armR.rotation.z=2.5+Math.sin(T*8)*.4;
      if(Math.random()<dt*3){const cp=topGroup.localToWorld(new THREE.Vector3((Math.random()-.5)*8,2,(Math.random()-.5)*6));burst(cp,null,40,7,1.6);}
    }
    if(winT>3.4&&!resultShown){resultShown=true; showResult(true);}
    focus.copy(courier.g.position); shadow.position.set(courier.g.position.x,topY+.02,courier.g.position.z);
  }
  if(state==="over"){
    overT+=dt; fallV+=22*dt;
    const a=courier.g.rotation.y*-1, rx=Math.cos(a), rz=Math.sin(a);
    courier.g.position.y-=fallV*dt;
    courier.g.position.x+=rx*fallSide*4*dt; courier.g.position.z+=rz*fallSide*4*dt;
    courier.pivot.rotation.x+=dt*6; courier.pivot.rotation.z+=dt*3*fallSide;
    shadow.visible=false;
    focus.copy(overFocus);
    if(overT>1.8&&!resultShown){resultShown=true; showResult(false);}
  }

  // cliente acenando
  if(customer){
    const wv=Math.sin(T*7)*.35;
    customer.parts.armR.rotation.z=2.5+wv;
    customer.parts.armL.rotation.z=(state==="win"&&delivered)?-2.5-wv:0;
    customer.pivot.position.y=1.1+(state==="win"&&delivered?Math.abs(Math.sin(T*8))*.25:0);
  }

  // efeitos visuais de estado
  shieldMesh.visible=shieldWire.visible=shield>0&&state==="play";
  shieldWire.rotation.y+=dt*.8; shieldWire.rotation.x+=dt*.3;
  stunSprite.visible=stunT>0&&state==="play";
  sayT=Math.max(0,sayT-dt); placeSay();
  stunSprite.material.rotation=T*4;
  if(turboT>0&&state==="play"&&Math.abs(vis-prevVis)>1e-4&&Math.random()<dt*25){
    burst(courier.g.position.clone().setY(courier.g.position.y-.9),0xffb703,6,2.5,.5,.25);
  }

  updateSteps();

  // câmera
  const ahead=P[Math.min(N,Math.floor(clamp(vis,0,N))+4)].a;
  if(state==="menu") camA+=dt*.18;
  else if(state==="win"&&delivered) camA+=dt*.35;
  else if(state==="play") camA+=(ahead-camA)*Math.min(1,dt*3);
  const vs=viewSize(), portrait=vs.h>vs.w;
  const back=state==="menu"?11:(portrait?9:7.8), up=state==="menu"?6:(portrait?6.8:5.2);
  const fx=Math.sin(camA),fz=-Math.cos(camA);
  desired.set(focus.x-fx*back,focus.y+up,focus.z-fz*back);
  const la=portrait&&state!=="menu"?2.2:6, ly=portrait&&state!=="menu"?0.6:2;   // em pé: mira mais perto para o entregador aparecer inteiro
  lookT.set(focus.x+fx*la,focus.y+ly,focus.z+fz*la);
  const kc=snapCam||(rock&&rock.phase==="push")?1:1-Math.exp(-dt*6);
  camera.position.lerp(desired,kc); camLook.lerp(lookT,kc);
  if(camShake>0){camera.position.x+=(Math.random()-.5)*camShake*.5;camera.position.y+=(Math.random()-.5)*camShake*.4;}
  camera.lookAt(camLook);
  snapCam=false;
  stars.position.copy(camera.position);
  sun.position.set(focus.x+12,focus.y+22,focus.z+8); sun.target.position.copy(focus);

  updateBursts(dt);
  if(state!=="menu") updateHud();
}
function animLimbs(p,sw,dt){
  p.parts.legL.rotation.x=sw; p.parts.legR.rotation.x=-sw;
  p.parts.armL.rotation.x=-sw*.8; p.parts.armR.rotation.x=sw*.8;
  p.parts.armL.rotation.z*=Math.max(0,1-dt*10); p.parts.armR.rotation.z*=Math.max(0,1-dt*10);
}
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta());
  update(dt);
  renderer.render(scene,camera);
}

/* ---------- TikFinity (presentes reais da live) ---------- */
const giftQueue=[];
function findGift(name,id){
  id=Number(id); const n=String(name||"").toLowerCase().trim();
  return GIFTS.find(g=>id&&g.tid.includes(id))||GIFTS.find(g=>g.names.includes(n))||null;
}
function receiveGift(name,user,id,count,pic){
  const g=findGift(name,id); if(!g) return false;
  if(pic&&/^https:\/\//.test(pic)&&g.img!==pic){
    g.img=pic; buildGiftPanel();
    try{const sv=JSON.parse(localStorage.getItem("topoGiftIcons")||"{}");sv[g.id]=pic;localStorage.setItem("topoGiftIcons",JSON.stringify(sv));}catch(e){}
  }
  const who=String(user||"Alguém").replace(/\s+/g," ").trim().slice(0,24)||"Alguém";
  for(let i=0;i<Math.min(20,Math.max(1,Number(count)||1));i++) giftQueue.push([g,who]);
  return true;
}
window.sendGift=receiveGift;
let queueT=0;
function pumpQueue(dt){
  if(state!=="play"||!giftQueue.length) return;
  queueT-=dt; if(queueT>0) return;
  const [g,who]=giftQueue.shift(); applyGift(g,who); queueT=.35;
}
function connectWS(){
  const url=PARAMS.get("ws")||"ws://localhost:21213/";
  let ws; try{ws=new WebSocket(url);}catch(e){return;}
  ws.onopen=()=>{ if(sim&&LIVE){sim=false;syncSimBtn();} };
  ws.onmessage=m=>{
    try{
      const d=JSON.parse(m.data), ev=d.event||d.type, data=d.data||d;
      if(ev!=="gift") return;
      if(data.giftType===1&&data.repeatEnd===false) return;   // combo ainda rolando
      receiveGift(data.giftName,data.nickname||data.uniqueId,data.giftId,data.repeatCount,data.giftPictureUrl);
    }catch(e){}
  };
  ws.onclose=()=>setTimeout(connectWS,5000);
}

/* ---------- janela da live: o painel manda os presentes de teste para ela ---------- */
let bc=null; try{bc=new BroadcastChannel("topo-live");}catch(e){}
if(bc&&LIVE) bc.onmessage=e=>{const m=e.data||{}; if(m.t==="mute"){muted=!!m.m;musicLevel();} if(m.t==="gift"){const g=GIFTS.find(x=>x.id===m.id); if(g) giftQueue.push([g,m.user||"Você"]);}};
function relay(g,user){ if(bc&&!LIVE) bc.postMessage({t:"gift",id:g.id,user}); }
$("#btnLive").addEventListener("click",()=>{
  const u=location.pathname+"?obs=1"+(PARAMS.get("ws")?"&ws="+encodeURIComponent(PARAMS.get("ws")):"");
  window.open(u,"entrega-live","width=540,height=960");
});

/* ---------- início ---------- */
buildGiftPanel(); renderRank();
setupWorld(1000); camA=P[0].a;
connectWS();
if(LIVE){ sim=PARAMS.get("sim")==="1"; syncSimBtn(); startGame(); } else showMenu();
const refreshLabels=()=>slots.forEach(s=>s.idx=-1);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(refreshLabels);
loop();
})();
</script>
