<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olha o Mate! 3D</title>
  <link rel="stylesheet" href="css/style.css?v=202611051">
  <style>
    #stage { position: relative; }
    #game3d, #game { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
    #game3d { background: #9fd3f0; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script>window.R3D_READY = new Promise((r) => { window.__r3dResolve = r; });</script>
</head>
<body>
  <div id="stage"><canvas id="game3d" width="720" height="1280"></canvas><canvas id="game" width="1080" height="1920"></canvas></div>

  <aside id="test-panel">
    <h2>OLHA O MATE! 3D</h2>
    <p class="note">Aperte <b>H</b> para esconder este painel antes de capturar a janela.</p>
    <div class="live-box">
      <label for="ws-url">Conexão da live (endereço WebSocket do TikFinity)</label>
      <div class="ws-row"><input id="ws-url" placeholder="ws://localhost:21213" autocomplete="off"><button class="ctrl" id="btn-ws">Conectar</button></div>
      <div id="ws-status">Modo teste (sem conexão)</div>
      <div id="unknown-gifts"></div>
    </div>
    <label for="ctl-select">Controle (espaço / ↑ / clique pula; volta ao automático sozinho)</label>
    <select id="ctl-select">
      <option value="auto">Automático: o vendedor pula sozinho</option>
      <option value="manual">Manual: eu pulo (espaço / ↑ / clique)</option>
    </select>
    <label for="test-user">Nome do espectador no teste (vazio = aleatório)</label>
    <input id="test-user" placeholder="@seu_nome" autocomplete="off">
    <div id="gift-buttons"></div>
    <div class="row">
      <button class="ctrl wide" id="btn-demo">Demo automático: desligado</button>
      <button class="ctrl" id="btn-reset">Nova rodada (R)</button>
      <button class="ctrl" id="btn-win">Pular p/ o Posto 6 (W)</button>
      <button class="ctrl" id="btn-full">Tela cheia (F)</button>
      <button class="ctrl wide" id="btn-hide">Esconder painel (H)</button>
    </div>
    <div id="voice-info"></div>
  </aside>

  <script src="js/config.js?v=202611051"></script>
  <script src="../jogos-live/presentes.js?v=202611051"></script>
  <script src="js/utils.js?v=202611051"></script>
  <script src="js/produtos-reserva.js?v=202611051"></script>
  <script src="js/audio.js?v=202611051"></script>
  <script src="js/catalog.js?v=202611051"></script>
  <script src="js/beach.js?v=202611051"></script>
  <script src="js/vendor.js?v=202611051"></script>
  <script src="js/effects.js?v=202611051"></script>
  <script src="js/hud.js?v=202611051"></script>
  <script src="js/gifts.js?v=202611051"></script>
  <script src="js/bridge.js?v=202611051"></script>
  <script src="js/game.js?v=202611051"></script>
  <script type="module" src="js/r3d.js?v=202611051"></script>
  <script src="js/main.js?v=202611051"></script>
  <script src="js/remote.js?v=202611051"></script>
</body>
</html>
